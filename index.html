<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8fa">
  <meta name="description"
    content="...">
  <title>お誕生日おめでとう</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <script src="./card.js" defer></script>
  <!-- <script src="./album.js" defer></script> -->
</head>

<body>
  <main>
    <a class="garden-link" href="./garden.html">Ngắm vườn hoa <span aria-hidden="true">❀</span></a>
    <canvas id="ambientPetalsCanvas" aria-hidden="true"></canvas>
    <header class="greeting">
      <p class="occasion">お誕生日 <span>07/11</span></p>
      <h1>Chúc mừng sinh nhật<br>Vân Anh</h1>
      <p class="greeting-caption">お誕生日おめでとうございます！</p>
    </header>

    <div class="gift-layout">
      <section class="scene-column" aria-label="...">


        <div class="gift-visuals">
          <div class="bouquet-composition">
            <div id="bouquetStageWrapper" role="button" tabindex="0"
              aria-label="Bó hoa hồng. Nhấn Enter để nhận lời chúc; dùng phím mũi tên để chọn bông hoa."
              aria-describedby="bouquetHint">
              <canvas id="bouquetCanvas" aria-hidden="true"></canvas>
            </div>
            <button class="envelope-button" id="openCard" type="button" aria-haspopup="dialog"
              aria-controls="greetingCard" aria-expanded="false" hidden>
              <span class="envelope" aria-hidden="true"><span class="envelope-letter">Gửi bạn</span><span
                  class="envelope-seal">♡</span></span>
              <span class="envelope-caption">Có một tấm thiệp cho cậu</span>
              <span class="envelope-action">Mở thiệp</span>
            </button>
          </div>

        </div>

        <footer class="scene-footer">
          <p id="bouquetHint" class="bouquet-hint">Bấm vào từng bông hoa để nhận lời chúc</p>
          <p id="roseWish" class="rose-wish" role="status" aria-live="polite" aria-atomic="true"></p>
          <button class="text-button" id="replayBloom" type="button">Cho hoa nở lại <span
              aria-hidden="true">↻</span></button>
          <a class="text-button" href="./garden.html" style="color: #76364d;">
            Ngắm vườn hoa <span aria-hidden="true">❀</span>
          </a>
        </footer>
      </section>

      <dialog id="greetingCard" class="card-dialog" aria-labelledby="cardTitle">
        <div class="letter-paper">
          <button class="close-button" id="closeCard" type="button" aria-label="Đóng thiệp">×</button>
          <div id="cardReading">
            <div class="letter-date" aria-label="..."><span>07</span><span class="date-stem"
                aria-hidden="true"></span><span>11</span></div>
            <p class="letter-recipient">Gửi <span id="cardRecipient">Vân Anh</span>,</p>
            <h2 id="cardTitle">Vân Anh Sinh nhật vui vẻ nhá</h2>
            <div class="letter-flower" aria-hidden="true">❀</div>
            <p id="cardMessage" class="letter-message"></p>
            <div class="letter-signoff">
              <p>Phòng 402,</p>
              <p id="cardSender" class="letter-signature"></p>
            </div>
            <div class="letter-fold" aria-hidden="true"></div>
            <div class="letter-actions">
              <button id="viewAlbum" class="text-button" type="button" aria-controls="memoryAlbum">Xem album kỷ niệm
                <span aria-hidden="true">♡</span></button>
              <button hidden id="editCard" class="text-button" type="button">Viết lời chúc riêng <span
                  aria-hidden="true">✎</span></button>
            </div>
          </div>
          <form id="cardEditor" hidden>
            <p class="editor-intro">Một tấm thiệp mang lời của bạn.</p>
            <h2 id="editorTitle" class="editor-title">Viết chút yêu thương</h2>
            <label for="recipientInput">Gửi đến</label>
            <input id="recipientInput" name="recipient" maxlength="60" required autocomplete="off">
            <label for="messageInput">Lời chúc dd/mm</label>
            <textarea id="messageInput" name="message" rows="7" maxlength="1500" required></textarea>
            <label for="senderInput">Người gửi</label>
            <input id="senderInput" name="sender" maxlength="60" required autocomplete="off">
            <p class="editor-hint">Lời chúc được lưu trên trình duyệt này.</p>
            <div class="editor-actions"><button class="primary-button" type="submit">Lưu lời chúc</button><button
                class="text-button" id="cancelEdit" type="button">Hủy</button></div>
          </form>
          <p id="cardStatus" class="card-status" role="status" aria-live="polite"></p>
        </div>
      </dialog>
    </div>
    <noscript>
      <p class="noscript-message">Bật JavaScript để ngắm hoa nở và mở thiệp nhé.</p>
    </noscript>
  </main>
</body>

</html>
